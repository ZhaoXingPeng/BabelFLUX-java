server {
    listen 80;
    listen [::]:80;
    server_name babelflux.icu www.babelflux.icu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://babelflux.icu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.babelflux.icu;
    ssl_certificate /etc/letsencrypt/live/babelflux.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babelflux.icu/privkey.pem;
    return 301 https://babelflux.icu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name babelflux.icu;
    server_tokens off;
    client_max_body_size 16m;

    ssl_certificate /etc/letsencrypt/live/babelflux.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babelflux.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /opt/babelflux/current/frontend;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        root /opt/babelflux/current/frontend;
        try_files $uri $uri/ /index.html;
    }
}
