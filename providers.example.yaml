# Java Spring Boot 后端的 provider 示例。默认使用本地 mock；真实百炼调用只读取环境变量中的密钥。
# 端点和模型名称应以账号实际可用性验证为准，不能把示例配置当作能力证明。
default_provider: mock

providers:
  mock:
    enabled: true
    description: "Local mock stream for stable demos and UI development."

  fun_asr:
    enabled: false
    endpoint: "wss://dashscope.aliyuncs.com/api-ws/v1/inference"
    model: "fun-asr-realtime"
    api_key_env: "DASHSCOPE_API_KEY"
    workspace_env: "DASHSCOPE_WORKSPACE_ID"
    description: "Streaming ASR provider for source-language subtitles."

  qwen_livetranslate:
    enabled: false
    endpoint: "wss://dashscope.aliyuncs.com/api-ws/v1/realtime"
    model: "qwen3.5-livetranslate-flash-realtime"
    api_key_env: "DASHSCOPE_API_KEY"
    description: "All-in-one realtime transcription, translation, and optional audio provider."

  qwen_tts:
    enabled: false
    endpoint: "wss://dashscope.aliyuncs.com/api-ws/v1/realtime?model=qwen3-tts-flash-realtime"
    model: "qwen3-tts-flash-realtime"
    api_key_env: "DASHSCOPE_API_KEY"
    workspace_env: "DASHSCOPE_WORKSPACE_ID"
    description: "Optional realtime TTS provider. Subtitles must not depend on it."

  correction_llm:
    enabled: false
    endpoint: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
    model: "qwen3.7-plus"
    api_key_env: "DASHSCOPE_API_KEY"
    workspace_env: "DASHSCOPE_WORKSPACE_ID"
    description: "Post-session correction provider for SessionReport generation."
